<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DANVEXIS POS</title><style>
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}button,input,select{font:inherit}header{min-height:64px;border-bottom:1px solid #252525;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;position:sticky;top:0;background:#080808;z-index:20}.brand{font-weight:900;letter-spacing:5px}.red{color:#d7192d}.wrap{max-width:1440px;margin:auto;padding:16px}.login,.panel{background:#101010;border:1px solid #292929;border-radius:16px;padding:16px}.hidden{display:none!important}input,select,button{background:#171717;color:#fff;border:1px solid #333;border-radius:10px;padding:12px;font-size:15px;min-height:44px}button{cursor:pointer;font-weight:900;background:#d7192d;border:0}.secondary{background:#242424}.top{display:flex;gap:10px;margin-bottom:14px;position:sticky;top:64px;background:#070707;padding:8px 0;z-index:10}.top input{flex:1;min-width:0}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(330px,.85fr);gap:14px;align-items:start}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.product{background:#101010;border:1px solid #292929;border-radius:14px;padding:10px;min-width:0;overflow:hidden}.product img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:#181818;display:block}.sku{color:#d7192d;font-size:10px;font-weight:900;letter-spacing:1.5px;margin-top:8px}.name{font-weight:900;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:#999;font-size:12px}.product select,.product button{width:100%;margin-top:8px}.cart{position:sticky;top:128px;height:max-content;max-height:calc(100vh - 144px);overflow:auto}.cartItem{padding:10px 0;border-bottom:1px solid #262626;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.qty{display:flex;gap:6px;align-items:center}.qty button{width:34px;height:34px;min-height:34px;padding:0}.total{font-size:30px;font-weight:900;margin:16px 0}.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.checkout{width:100%;padding:15px;margin-top:12px}.status{margin-top:10px}.ok{color:#72df8c}.error{color:#ff7474}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.metric{background:#101010;border:1px solid #292929;border-radius:12px;padding:10px 14px;min-width:0}.metric b{display:block;font-size:20px;white-space:nowrap}.logout{width:auto}.empty{padding:30px;text-align:center;color:#888}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px}.sectionTitle h2{margin:0}.history{display:grid;gap:8px}.saleRow{background:#0d0d0d;border:1px solid #292929;border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px}.saleRow b{display:block}.saleMeta{color:#999;font-size:12px;line-height:1.5}.receiptActions{display:flex;gap:8px;margin-top:10px}.receiptActions button{flex:1}.badge{display:inline-block;border:1px solid #333;border-radius:999px;padding:4px 8px;font-size:11px;color:#bbb}.dailyTotal{font-size:22px;font-weight:900}
@media(max-width:1100px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr)}}
@media(max-width:820px){header{min-height:58px}.wrap{padding:10px}.layout{grid-template-columns:1fr}.cart{position:static;max-height:none;order:-1}.top{top:58px}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{grid-template-columns:repeat(3,minmax(135px,1fr));overflow-x:auto;padding-bottom:2px}.metric{min-width:135px}.paygrid{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:560px){header{padding:10px 12px}.brand{font-size:13px;letter-spacing:3px}.logout{padding:10px 12px}.wrap{padding:8px}.top{gap:7px}.top button{padding:10px}.products{grid-template-columns:1fr}.product{padding:10px}.product img{aspect-ratio:5/6}.metrics{grid-template-columns:repeat(3,minmax(115px,1fr));gap:6px}.metric{min-width:115px;padding:9px}.metric b{font-size:18px}.paygrid{grid-template-columns:1fr}.saleRow{grid-template-columns:1fr}.receiptActions{flex-direction:column}}
@media(min-width:1500px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media print{body{background:#fff;color:#000}header,.wrap>*:not(#printReceipt){display:none!important}#printReceipt{display:block!important;color:#000;background:#fff;padding:24px}.receiptPrint{max-width:360px;margin:auto;font-family:monospace}.receiptPrint h2{text-align:center}.receiptPrint table{width:100%;border-collapse:collapse}.receiptPrint td{padding:4px 0}.receiptPrint .right{text-align:right}}
</style></head><body><header><div class="brand">DANVEXIS <span class="red">POS</span></div><button id="logout" class="secondary logout hidden">LOG OUT</button></header><div class="wrap">
<section id="login" class="login"><h2>POS Login</h2><p class="muted">Use your DANVEXIS Firebase admin account.</p><input id="email" type="email" placeholder="Email" style="width:100%;margin:5px 0"><input id="password" type="password" placeholder="Password" style="width:100%;margin:5px 0"><button id="loginBtn" style="width:100%;margin-top:6px">SIGN IN</button><div id="loginMsg" class="status"></div></section>
<section id="app" class="hidden"><div class="metrics"><div class="metric"><span class="muted">CART ITEMS</span><b id="itemCount">0</b></div><div class="metric"><span class="muted">TOTAL</span><b id="miniTotal">LKR 0</b></div><div class="metric"><span class="muted">PAYMENT</span><b id="payLabel">CASH</b></div></div><div class="top"><input id="search" placeholder="Search product / SKU"><button id="refresh" class="secondary">REFRESH</button></div><div class="layout"><div><div id="products" class="products"></div></div><aside class="panel cart"><h2 style="margin-top:0">Current Sale</h2><div id="cart"></div><div class="total" id="total">LKR 0</div><div class="paygrid"><button class="pay" data-pay="Cash">CASH</button><button class="pay secondary" data-pay="Card">CARD</button><button class="pay secondary" data-pay="Bank Transfer">BANK</button></div><input id="discount" type="number" min="0" value="0" placeholder="Discount LKR" style="width:100%;margin-top:10px"><input id="customer" placeholder="Customer name (optional)" style="width:100%;margin-top:8px"><input id="phone" placeholder="Phone (optional)" style="width:100%;margin-top:8px"><button id="checkout" class="checkout">COMPLETE SALE</button><button id="clear" class="secondary" style="width:100%;margin-top:8px">CLEAR CART</button><div id="msg" class="status"></div></aside></div>
<div class="sectionTitle"><h2>Today’s POS Sales</h2><div class="dailyTotal" id="dailyTotal">LKR 0</div></div><div id="history" class="history"></div>
</section><div id="printReceipt" class="hidden"></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";import{getFirestore,collection,getDocs,doc,writeBatch,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB7VnK4N_Fo2JhCNcYL-UY9gyqhezXI0-8",authDomain:"danvexis-3a1e0.firebaseapp.com",projectId:"danvexis-3a1e0",storageBucket:"danvexis-3a1e0.firebasestorage.app",messagingSenderId:"1083975479921",appId:"1:1083975479921:web:3a67e7b171f2652def61d0",measurementId:"G-EWJPTVB38Y"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let products=[],cart=[],payment='Cash';const money=n=>'LKR '+Number(n||0).toLocaleString();const safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function norm(d){let sizes=Array.isArray(d.sizes)?d.sizes:(d.size?[d.size]:['M']),stock=(d.stock&&typeof d.stock==='object')?{...d.stock}:{[sizes[0]]:Number(d.stockTotal??d.stock??0)};return{sizes,stock}}
async function loadProducts(){try{const s=await getDocs(collection(db,'products'));products=[];s.forEach(x=>{const d=x.data(),n=norm(d);products.push({id:x.id,...d,...n})});renderProducts()}catch(e){$('products').innerHTML='<div class="error">'+safe(e.message)+'</div>'}}
function renderProducts(){const q=$('search').value.toLowerCase().trim(),list=products.filter(p=>!q||(`${p.name||''} ${p.sku||''} ${p.category||''}`).toLowerCase().includes(q));$('products').innerHTML=list.map(p=>{const avail=p.sizes.filter(s=>Number(p.stock[s]||0)>0);const img=p.imageData||p.imageUrl||'';return`<div class="product">${img?`<img src="${safe(img)}">`:''}<div class="sku">${safe(p.sku||'DANVEXIS')}</div><div class="name">${safe(p.name||'Product')}</div><div class="muted">${money(p.price)} · ${avail.reduce((a,s)=>a+Number(p.stock[s]||0),0)} in stock</div><select data-size="${safe(p.id)}">${p.sizes.map(s=>`<option ${Number(p.stock[s]||0)<=0?'disabled':''}>${safe(s)} — ${Number(p.stock[s]||0)}</option>`).join('')}</select><button class="add" data-id="${safe(p.id)}" ${avail.length?'':'disabled'}>${avail.length?'ADD TO SALE':'SOLD OUT'}</button></div>`}).join('')||'<div class="empty">No products found.</div>';$('products').querySelectorAll('.add').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.id),sel=document.querySelector(`[data-size="${CSS.escape(p.id)}"]`),size=sel.value.split(' — ')[0];add(p,size)})}
function add(p,size){const stock=Number(p.stock[size]||0),x=cart.find(i=>i.id===p.id&&i.size===size);if((x?.qty||0)>=stock)return alert('No more stock available for this size.');if(x)x.qty++;else cart.push({id:p.id,name:p.name||'Product',sku:p.sku||'',size,qty:1,price:Number(p.price||0)});renderCart()}
function calc(){const sub=cart.reduce((a,x)=>a+x.price*x.qty,0),disc=Math.max(0,Number($('discount').value||0));return{sub,disc,total:Math.max(0,sub-disc)}}function renderCart(){const c=calc();$('cart').innerHTML=cart.map((x,i)=>`<div class="cartItem"><div><b>${safe(x.name)}</b><div class="muted">${safe(x.size)} · ${money(x.price)} × ${x.qty}</div></div><div class="qty"><button class="secondary minus" data-i="${i}">−</button><b>${x.qty}</b><button class="secondary plus" data-i="${i}">+</button></div></div>`).join('')||'<div class="empty">Cart is empty</div>';$('total').textContent=money(c.total);$('miniTotal').textContent=money(c.total);$('itemCount').textContent=cart.reduce((a,x)=>a+x.qty,0);$('cart').querySelectorAll('.minus').forEach(b=>b.onclick=()=>{let x=cart[+b.dataset.i];x.qty--;if(x.qty<=0)cart.splice(+b.dataset.i,1);renderCart()});$('cart').querySelectorAll('.plus').forEach(b=>b.onclick=()=>{let x=cart[+b.dataset.i],p=products.find(z=>z.id===x.id);if(x.qty<Number(p.stock[x.size]||0))x.qty++;renderCart()})}
function localDayKey(v){const d=v?.toDate?v.toDate():new Date(v||Date.now());return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
async function loadHistory(){try{const snap=await getDocs(collection(db,'orders')),today=localDayKey(Date.now()),rows=[];let total=0;snap.forEach(x=>{const d=x.data();if(d.source==='POS'&&localDayKey(d.createdAt)===today){rows.push({id:x.id,...d});total+=Number(d.total||0)}});rows.sort((a,b)=>((b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)));$('dailyTotal').textContent=money(total);$('history').innerHTML=rows.slice(0,20).map(r=>{const dt=r.createdAt?.toDate?r.createdAt.toDate():null,when=dt?dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'Recent';return `<div class="saleRow"><div><b>${safe(r.customer?.name||'Walk-in Customer')} · ${money(r.total)}</b><div class="saleMeta">${safe(when)} · ${safe(r.paymentMethod||'Cash')} · ${safe(r.id.slice(0,10))}<br>${(r.items||[]).map(i=>`${safe(i.name)} (${safe(i.size)}) × ${Number(i.qty||0)}`).join(' · ')}</div></div><div><span class="badge">${safe(r.status||'Delivered')}</span><div class="receiptActions"><button class="secondary reprint" data-id="${safe(r.id)}">RECEIPT</button></div></div></div>`}).join('')||'<div class="empty">No POS sales today.</div>';$('history').querySelectorAll('.reprint').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id===b.dataset.id);printReceipt(r)})}catch(e){$('history').innerHTML='<div class="error">'+safe(e.message)+'</div>'}}
function printReceipt(r){if(!r)return;const items=(r.items||[]).map(i=>`<tr><td>${safe(i.name)}<br><small>${safe(i.size)} × ${Number(i.qty||0)}</small></td><td class="right">${money(Number(i.price||0)*Number(i.qty||0))}</td></tr>`).join('');$('printReceipt').innerHTML=`<div class="receiptPrint"><h2>DANVEXIS</h2><p style="text-align:center">POS RECEIPT</p><p>Sale: ${safe(r.id||'')}</p><p>Customer: ${safe(r.customer?.name||'Walk-in Customer')}</p><p>Payment: ${safe(r.paymentMethod||'Cash')}</p><hr><table>${items}</table><hr><table><tr><td>Subtotal</td><td class="right">${money(r.subtotal||0)}</td></tr><tr><td>Discount</td><td class="right">-${money(r.discount||0)}</td></tr><tr><td><b>TOTAL</b></td><td class="right"><b>${money(r.total||0)}</b></td></tr></table><p style="text-align:center;margin-top:24px">EVOLVE WITHOUT LIMITS</p></div>`;$('printReceipt').classList.remove('hidden');window.print();setTimeout(()=>$('printReceipt').classList.add('hidden'),500)}
async function checkout(){if(!cart.length)return;$('checkout').disabled=true;$('msg').textContent='Processing sale...';try{const fresh=await getDocs(collection(db,'products')),map=new Map();fresh.forEach(s=>map.set(s.id,s.data()));for(const x of cart){const d=map.get(x.id);if(!d)throw Error(`${x.name} no longer exists.`);const n=norm(d);if(Number(n.stock[x.size]||0)<x.qty)throw Error(`Not enough ${x.size} stock for ${x.name}.`)}const c=calc(),batch=writeBatch(db),orderRef=doc(collection(db,'orders'));for(const x of cart){const d=map.get(x.id),n=norm(d);n.stock[x.size]=Number(n.stock[x.size]||0)-x.qty;const total=n.sizes.reduce((a,s)=>a+Number(n.stock[s]||0),0);batch.update(doc(db,'products',x.id),{stock:n.stock,stockTotal:total,updatedAt:serverTimestamp()})}batch.set(orderRef,{source:'POS',paymentMethod:payment,status:'Delivered',customer:{name:$('customer').value.trim()||'Walk-in Customer',phone:$('phone').value.trim()},items:cart.map(x=>({...x})),subtotal:c.sub,discount:c.disc,total:c.total,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});await batch.commit();const receipt={id:orderRef.id,source:'POS',paymentMethod:payment,status:'Delivered',customer:{name:$('customer').value.trim()||'Walk-in Customer',phone:$('phone').value.trim()},items:cart.map(x=>({...x})),subtotal:c.sub,discount:c.disc,total:c.total};$('msg').innerHTML=`<span class="ok">Sale complete · ${safe(orderRef.id.slice(0,10))} · ${money(c.total)}</span>`;printReceipt(receipt);cart=[];$('discount').value=0;$('customer').value='';$('phone').value='';await loadProducts();await loadHistory();renderCart()}catch(e){$('msg').innerHTML='<span class="error">'+safe(e.message)+'</span>'}finally{$('checkout').disabled=false}}
$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('loginMsg').textContent=''}catch(e){$('loginMsg').innerHTML='<span class="error">'+safe(e.message)+'</span>'}};$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{$('login').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);$('logout').classList.toggle('hidden',!u);if(u){loadProducts();loadHistory();renderCart()}});$('search').oninput=renderProducts;$('refresh').onclick=()=>{loadProducts();loadHistory()};$('discount').oninput=renderCart;$('clear').onclick=()=>{cart=[];renderCart()};$('checkout').onclick=checkout;document.querySelectorAll('.pay').forEach(b=>b.onclick=()=>{payment=b.dataset.pay;$('payLabel').textContent=payment.toUpperCase();document.querySelectorAll('.pay').forEach(x=>x.classList.add('secondary'));b.classList.remove('secondary')});
</script></body></html>
