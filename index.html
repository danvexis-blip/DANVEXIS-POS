<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DANVEXIS POS</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}header{height:64px;border-bottom:1px solid #252525;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;background:#080808;z-index:10}.brand{font-weight:900;letter-spacing:5px}.red{color:#d7192d}.wrap{max-width:1400px;margin:auto;padding:16px}.login,.panel{background:#101010;border:1px solid #292929;border-radius:16px;padding:16px}.hidden{display:none!important}input,select,button{background:#171717;color:#fff;border:1px solid #333;border-radius:10px;padding:12px;font-size:15px}button{cursor:pointer;font-weight:900;background:#d7192d;border:0}.secondary{background:#242424}.top{display:flex;gap:10px;margin-bottom:14px}.top input{flex:1}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,.8fr);gap:14px}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product{background:#101010;border:1px solid #292929;border-radius:14px;padding:10px;min-width:0}.product img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:#181818}.sku{color:#d7192d;font-size:10px;font-weight:900;letter-spacing:1.5px;margin-top:8px}.name{font-weight:900;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:#999;font-size:12px}.product select,.product button{width:100%;margin-top:8px}.cart{position:sticky;top:80px;height:max-content}.cartItem{padding:10px 0;border-bottom:1px solid #262626;display:grid;grid-template-columns:1fr auto;gap:8px}.qty{display:flex;gap:6px;align-items:center}.qty button{width:34px;height:34px;padding:0}.total{font-size:30px;font-weight:900;margin:16px 0}.paygrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.checkout{width:100%;padding:15px;margin-top:12px}.status{margin-top:10px}.ok{color:#72df8c}.error{color:#ff7474}.metrics{display:flex;gap:8px;margin-bottom:12px}.metric{background:#101010;border:1px solid #292929;border-radius:12px;padding:10px 14px}.metric b{display:block;font-size:20px}.logout{width:auto}.empty{padding:30px;text-align:center;color:#888}
@media(max-width:900px){.layout{grid-template-columns:1fr}.cart{position:static}.products{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){header{height:58px}.brand{font-size:13px;letter-spacing:3px}.wrap{padding:10px}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.product{padding:8px}.top{position:sticky;top:58px;background:#070707;padding:8px 0;z-index:8}.metrics{overflow:auto}.metric{min-width:120px}.paygrid{grid-template-columns:1fr}.layout{gap:10px}}
</style></head><body><header><div class="brand">DANVEXIS <span class="red">POS</span></div><button id="logout" class="secondary logout hidden">LOG OUT</button></header><div class="wrap">
<section id="login" class="login"><h2>POS Login</h2><p class="muted">Use your DANVEXIS Firebase admin account.</p><input id="email" type="email" placeholder="Email" style="width:100%;margin:5px 0"><input id="password" type="password" placeholder="Password" style="width:100%;margin:5px 0"><button id="loginBtn" style="width:100%;margin-top:6px">SIGN IN</button><div id="loginMsg" class="status"></div></section>
<section id="app" class="hidden"><div class="metrics"><div class="metric"><span class="muted">CART ITEMS</span><b id="itemCount">0</b></div><div class="metric"><span class="muted">TOTAL</span><b id="miniTotal">LKR 0</b></div><div class="metric"><span class="muted">PAYMENT</span><b id="payLabel">CASH</b></div></div><div class="top"><input id="search" placeholder="Search product / SKU"><button id="refresh" class="secondary">REFRESH</button></div><div class="layout"><div><div id="products" class="products"></div></div><aside class="panel cart"><h2 style="margin-top:0">Current Sale</h2><div id="cart"></div><div class="total" id="total">LKR 0</div><div class="paygrid"><button class="pay" data-pay="Cash">CASH</button><button class="pay secondary" data-pay="Card">CARD</button><button class="pay secondary" data-pay="Bank Transfer">BANK</button></div><input id="discount" type="number" min="0" value="0" placeholder="Discount LKR" style="width:100%;margin-top:10px"><input id="customer" placeholder="Customer name (optional)" style="width:100%;margin-top:8px"><input id="phone" placeholder="Phone (optional)" style="width:100%;margin-top:8px"><button id="checkout" class="checkout">COMPLETE SALE</button><button id="clear" class="secondary" style="width:100%;margin-top:8px">CLEAR CART</button><div id="msg" class="status"></div></aside></div></section></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";import{getFirestore,collection,getDocs,doc,writeBatch,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB7VnK4N_Fo2JhCNcYL-UY9gyqhezXI0-8",authDomain:"danvexis-3a1e0.firebaseapp.com",projectId:"danvexis-3a1e0",storageBucket:"danvexis-3a1e0.firebasestorage.app",messagingSenderId:"1083975479921",appId:"1:1083975479921:web:3a67e7b171f2652def61d0",measurementId:"G-EWJPTVB38Y"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let products=[],cart=[],payment='Cash';const money=n=>'LKR '+Number(n||0).toLocaleString();const safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function norm(d){let sizes=Array.isArray(d.sizes)?d.sizes:(d.size?[d.size]:['M']),stock=(d.stock&&typeof d.stock==='object')?{...d.stock}:{[sizes[0]]:Number(d.stockTotal??d.stock??0)};return{sizes,stock}}
async function loadProducts(){try{const s=await getDocs(collection(db,'products'));products=[];s.forEach(x=>{const d=x.data(),n=norm(d);products.push({id:x.id,...d,...n})});renderProducts()}catch(e){$('products').innerHTML='<div class="error">'+safe(e.message)+'</div>'}}
function renderProducts(){const q=$('search').value.toLowerCase().trim(),list=products.filter(p=>!q||(`${p.name||''} ${p.sku||''} ${p.category||''}`).toLowerCase().includes(q));$('products').innerHTML=list.map(p=>{const avail=p.sizes.filter(s=>Number(p.stock[s]||0)>0);const img=p.imageData||p.imageUrl||'';return`<div class="product">${img?`<img src="${safe(img)}">`:''}<div class="sku">${safe(p.sku||'DANVEXIS')}</div><div class="name">${safe(p.name||'Product')}</div><div class="muted">${money(p.price)} · ${avail.reduce((a,s)=>a+Number(p.stock[s]||0),0)} in stock</div><select data-size="${safe(p.id)}">${p.sizes.map(s=>`<option ${Number(p.stock[s]||0)<=0?'disabled':''}>${safe(s)} — ${Number(p.stock[s]||0)}</option>`).join('')}</select><button class="add" data-id="${safe(p.id)}" ${avail.length?'':'disabled'}>${avail.length?'ADD TO SALE':'SOLD OUT'}</button></div>`}).join('')||'<div class="empty">No products found.</div>';$('products').querySelectorAll('.add').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.id),sel=document.querySelector(`[data-size="${CSS.escape(p.id)}"]`),size=sel.value.split(' — ')[0];add(p,size)})}
function add(p,size){const stock=Number(p.stock[size]||0),x=cart.find(i=>i.id===p.id&&i.size===size);if((x?.qty||0)>=stock)return alert('No more stock available for this size.');if(x)x.qty++;else cart.push({id:p.id,name:p.name||'Product',sku:p.sku||'',size,qty:1,price:Number(p.price||0)});renderCart()}
function calc(){const sub=cart.reduce((a,x)=>a+x.price*x.qty,0),disc=Math.max(0,Number($('discount').value||0));return{sub,disc,total:Math.max(0,sub-disc)}}function renderCart(){const c=calc();$('cart').innerHTML=cart.map((x,i)=>`<div class="cartItem"><div><b>${safe(x.name)}</b><div class="muted">${safe(x.size)} · ${money(x.price)} × ${x.qty}</div></div><div class="qty"><button class="secondary minus" data-i="${i}">−</button><b>${x.qty}</b><button class="secondary plus" data-i="${i}">+</button></div></div>`).join('')||'<div class="empty">Cart is empty</div>';$('total').textContent=money(c.total);$('miniTotal').textContent=money(c.total);$('itemCount').textContent=cart.reduce((a,x)=>a+x.qty,0);$('cart').querySelectorAll('.minus').forEach(b=>b.onclick=()=>{let x=cart[+b.dataset.i];x.qty--;if(x.qty<=0)cart.splice(+b.dataset.i,1);renderCart()});$('cart').querySelectorAll('.plus').forEach(b=>b.onclick=()=>{let x=cart[+b.dataset.i],p=products.find(z=>z.id===x.id);if(x.qty<Number(p.stock[x.size]||0))x.qty++;renderCart()})}
async function checkout(){if(!cart.length)return;$('checkout').disabled=true;$('msg').textContent='Processing sale...';try{const fresh=await getDocs(collection(db,'products')),map=new Map();fresh.forEach(s=>map.set(s.id,s.data()));for(const x of cart){const d=map.get(x.id);if(!d)throw Error(`${x.name} no longer exists.`);const n=norm(d);if(Number(n.stock[x.size]||0)<x.qty)throw Error(`Not enough ${x.size} stock for ${x.name}.`)}const c=calc(),batch=writeBatch(db),orderRef=doc(collection(db,'orders'));for(const x of cart){const d=map.get(x.id),n=norm(d);n.stock[x.size]=Number(n.stock[x.size]||0)-x.qty;const total=n.sizes.reduce((a,s)=>a+Number(n.stock[s]||0),0);batch.update(doc(db,'products',x.id),{stock:n.stock,stockTotal:total,updatedAt:serverTimestamp()})}batch.set(orderRef,{source:'POS',paymentMethod:payment,status:'Delivered',customer:{name:$('customer').value.trim()||'Walk-in Customer',phone:$('phone').value.trim()},items:cart.map(x=>({...x})),subtotal:c.sub,discount:c.disc,total:c.total,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});await batch.commit();$('msg').innerHTML=`<span class="ok">Sale complete · ${safe(orderRef.id.slice(0,10))} · ${money(c.total)}</span>`;cart=[];$('discount').value=0;$('customer').value='';$('phone').value='';await loadProducts();renderCart()}catch(e){$('msg').innerHTML='<span class="error">'+safe(e.message)+'</span>'}finally{$('checkout').disabled=false}}
$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('loginMsg').textContent=''}catch(e){$('loginMsg').innerHTML='<span class="error">'+safe(e.message)+'</span>'}};$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{$('login').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);$('logout').classList.toggle('hidden',!u);if(u){loadProducts();renderCart()}});$('search').oninput=renderProducts;$('refresh').onclick=loadProducts;$('discount').oninput=renderCart;$('clear').onclick=()=>{cart=[];renderCart()};$('checkout').onclick=checkout;document.querySelectorAll('.pay').forEach(b=>b.onclick=()=>{payment=b.dataset.pay;$('payLabel').textContent=payment.toUpperCase();document.querySelectorAll('.pay').forEach(x=>x.classList.add('secondary'));b.classList.remove('secondary')});
</script></body></html>
